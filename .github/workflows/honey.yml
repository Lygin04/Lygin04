name: Honey harvest animation

on:
  schedule:
    # каждый день в 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_snake  — цвет «сборщика»
          # color_dots   — 5 уровней сот: от пустой до самой заполненной
          outputs: |
            dist/honey.svg?color_snake=%23d97706&color_dots=%23fff8e1,%23ffe082,%23ffb300,%23f57c00,%23e65100
            dist/honey-dark.svg?color_snake=%23fbbf24&color_dots=%231c1917,%23713f12,%23b45309,%23f59e0b,%23fde047

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
